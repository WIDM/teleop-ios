name: ios

on:
  push:
  pull_request:
  # Every night at 02:00 Asia/Taipei, on the default branch: the full Default plan, every UI test included.
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      plan:
        description: Test plan for the app job
        type: choice
        options: [Critical, Default]
        default: Critical

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODEGEN_VERSION: "2.46.0"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # Fast checks that need no Xcode: a result within a minute or two.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check string catalog
        run: python3 scripts/check-strings.py
      - name: No empty button actions
        run: python3 scripts/check-dead-buttons.py
      - name: Scripts' own unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: CI copy matches the workflow (ci/ios.yml)
        run: diff -u .github/workflows/ios.yml ci/ios.yml

      - name: Secret scan of the whole history (gitleaks)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

  # The core package and the safety checker: a few minutes on macOS.
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The safety checker's drift report diffs against its sync commit, so it needs the history.
          fetch-depth: 0

      - name: Swift layout (reported only, see docs/TESTING.md)
        run: scripts/check-format.sh
        continue-on-error: true

      - name: Core package tests (session, link, server model, conformance to the server recordings)
        run: swift test
        working-directory: Packages/TeleopCore

      - name: Session safety checker (every action in every reachable state)
        run: tools/session-safety/scripts/check.sh

  # The app's unit tests and UI tests. A push or pull request runs the Critical plan (every unit test, only the
  # critical-path UI tests); the nightly run runs Default (every UI test). See docs/TESTING.md.
  app:
    runs-on: macos-15
    env:
      TEST_PLAN: ${{ github.event_name == 'schedule' && 'Default' || inputs.plan || 'Critical' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        run: |
          xcrun simctl list devices available
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone 1[0-9] Pro( Max)?|iPhone 1[0-9]' | head -n 1)
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Boot simulator
        timeout-minutes: 15
        run: |
          # The test steps name the device only, so xcodebuild takes the one with that name on the newest iOS.
          # Boot that one and wait until it has finished, so that the tests do not start on a device still booting.
          UDID=$(python3 - <<'PY'
          import json, os, re, subprocess
          listing = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          newest = None
          for runtime, devices in listing["devices"].items():
              version = re.search(r"\.iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime)
              if not version:
                  continue
              key = tuple(int(part or 0) for part in version.groups())
              for device in devices:
                  if device["name"] == os.environ["SIM_NAME"] and (newest is None or key > newest[0]):
                      newest = (key, device["udid"])
          print(newest[1])
          PY
          )
          echo "Booting $SIM_NAME ($UDID)"
          xcrun simctl bootstatus "$UDID" -b

      - name: Prepare build dir
        run: mkdir -p build

      - name: xcodebuild test (${{ env.TEST_PLAN }} plan)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Teleop.xcodeproj \
            -scheme Teleop \
            -testPlan "$TEST_PLAN" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -resultBundlePath build/Teleop.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log
        env:
          NSUnbufferedIO: "YES"

      - name: No system log copied to the unit tests' console
        if: ${{ !cancelled() && hashFiles('build/xcodebuild.log') != '' }}
        run: python3 scripts/check-test-console.py build/xcodebuild.log

      - name: xcodebuild test with the aids switched off
        run: |
          set -o pipefail
          xcodebuild test \
            -project Teleop.xcodeproj \
            -scheme Teleop \
            -testPlan AssistOff \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild-assist-off.log
        env:
          NSUnbufferedIO: "YES"

      - name: No system log copied to the unit tests' console with the aids switched off
        if: ${{ !cancelled() && hashFiles('build/xcodebuild-assist-off.log') != '' }}
        run: python3 scripts/check-test-console.py build/xcodebuild-assist-off.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/Teleop.xcresult --output-path build/screenshots || true
          python3 - <<'PY'
          import json, pathlib, re, shutil
          out = pathlib.Path("build/screenshots")
          manifest = out / "manifest.json"
          if manifest.exists():
              for test in json.loads(manifest.read_text()):
                  for att in test.get("attachments", []):
                      src = out / att["exportedFileName"]
                      name = att.get("suggestedHumanReadableName", src.stem).split("_0_")[0]
                      if src.exists():
                          shutil.copy(src, out / (name + src.suffix))
          # A failing UI test adds attachments named after the element, quotes included, and the artifact upload
          # refuses the whole folder over one such name.
          for path in list(out.iterdir()):
              safe = re.sub(r'["<>|*?:\r\n]', "_", path.name)
              if safe == path.name:
                  continue
              target, n = path.with_name(safe), 1
              while target.exists():
                  target = path.with_name(f"{pathlib.Path(safe).stem}-{n}{pathlib.Path(safe).suffix}")
                  n += 1
              path.rename(target)
          PY

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build/xcodebuild.log
            build/xcodebuild-assist-off.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/Teleop.xcresult
