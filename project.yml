name: Teleop
options:
  bundleIdPrefix: widm.teleop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "12"
packages:
  TeleopCore:
    path: Packages/TeleopCore
targets:
  Teleop:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TeleopCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Teleop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: The camera tracks the phone pose and detects volume-key hold and release.
        NSMotionUsageDescription: Motion sensors map phone rotation to wrist orientation.
        NSLocalNetworkUsageDescription: The app connects to the teleop server on your network.
        # The server speaks plain ws:// on a LAN or Tailscale address, which ATS blocks by default.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: widm.teleop.app
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_LANGUAGE: en
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TeleopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TeleopTests
    dependencies:
      - target: Teleop
      - package: TeleopCore
      - package: TeleopCore
        product: TeleopServerModel
      - package: TeleopCore
        product: TeleopServerHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: widm.teleop.app.tests
        GENERATE_INFOPLIST_FILE: YES
  TeleopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TeleopUITests
    dependencies:
      - target: Teleop
      - package: TeleopCore
        product: TeleopServerHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: widm.teleop.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Teleop:
    build:
      targets:
        Teleop: all
    run:
      config: Debug
    test:
      config: Debug
      # Default: everything but the live tests. Live: only ServerMotionTests, which drive the lab simulator
      # through port 8765 and also need TEST_RUNNER_TELEOP_MOTION=1.
      testPlans:
        - path: TestPlans/Default.xctestplan
          defaultPlan: true
        - path: TestPlans/Live.xctestplan
