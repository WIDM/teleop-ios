name: git-hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check PR title, body, branch and commits
        if: github.event_name == 'pull_request'
        env:
          HYGIENE_PR_TITLE: ${{ github.event.pull_request.title }}
          HYGIENE_PR_BODY: ${{ github.event.pull_request.body }}
          HYGIENE_BRANCH: ${{ github.event.pull_request.head.ref }}
          HYGIENE_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-git-hygiene.py --from-env
      - name: Check pushed branch and commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          HYGIENE_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # On the default branch, check what the push added. On any other branch, check every commit the default
        # branch cannot reach: merging it in brings commits that were already checked when they landed.
        run: |
          if [ "$HYGIENE_BRANCH" = "$DEFAULT_BRANCH" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            base="origin/$DEFAULT_BRANCH"
          fi
          HYGIENE_RANGE="$base..$AFTER" python3 scripts/check-git-hygiene.py --from-env
